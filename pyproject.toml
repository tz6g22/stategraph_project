[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stategraph-project"
version = "0.1.0"
description = "Skeleton for graph-based state revision and invalidation propagation experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stategraph_project*"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
