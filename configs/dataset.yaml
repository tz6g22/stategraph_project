# Dataset paths for future JSONL-based experiments.
# Datasets are intentionally not downloaded by this skeleton.
datasets:
  stale:
    path: data/stale
    split: test
  statechangebench:
    path: data/statechangebench
    split: test
  longmemeval:
    path: data/longmemeval
    split: test
  longmemeval_v2:
    path: data/longmemeval_v2
    split: test
  memora:
    path: data/memora
    split: test

io:
  input_format: jsonl
  output_format: jsonl

